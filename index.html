<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>진영고 분실물 알림</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #222;
    }

    header {
      background: white;
      padding: 20px;
      border-bottom: 1px solid #ddd;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      margin: 0;
      font-size: 22px;
    }

    .container {
      max-width: 900px;
      margin: 40px auto;
      padding: 20px;
    }

    .hero {
      background: white;
      padding: 40px 25px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 5px 20px rgba(0,0,0,0.05);
    }

    .hero h2 {
      font-size: 30px;
      margin-bottom: 10px;
    }

    .hero p {
      color: #666;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-top: 25px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 15px;
      text-align: center;
      border: 1px solid #eee;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 12px 18px;
      cursor: pointer;
      background: #222;
      color: white;
      font-size: 14px;
    }

    button:hover {
      opacity: 0.85;
    }

    .login-box {
      background: white;
      padding: 25px;
      border-radius: 15px;
      margin-top: 25px;
      border: 1px solid #eee;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 7px 0;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
    }

    #userInfo {
      margin-top: 15px;
      padding: 12px;
      background: #f1f3f5;
      border-radius: 10px;
      display: none;
    }

    .hidden {
      display: none;
    }

    @media (max-width: 700px) {
      .cards {
        grid-template-columns: 1fr;
      }
    }
    .report-box {
  background: white;
  padding: 25px;
  border-radius: 15px;
  margin-top: 25px;
  border: 1px solid #eee;
}

.report-box label {
  display: block;
  margin-top: 15px;
  margin-bottom: 5px;
  font-weight: bold;
}

.report-box select,
.report-box textarea {
  width: 100%;
  padding: 12px;
  border: 1px solid #ddd;
  border-radius: 8px;
  font-size: 14px;
  font-family: inherit;
}

.report-box textarea {
  resize: vertical;
}
  </style>
</head>

<body>

<header>
  <h1>진영고 분실물 알림</h1>
  <button id="logoutBtn" class="hidden">로그아웃</button>
</header>

<div class="container">
<div class="report-box">
  <h2>📝 분실물 제보</h2>

  <label>구분</label>
  <select id="postType">
    <option value="lost">분실물</option>
    <option value="found">습득물</option>
  </select>

  <label>제목</label>
  <input
    type="text"
    id="postTitle"
    placeholder="예: 검은색 지갑을 잃어버렸어요"
  >

  <label>내용</label>
  <textarea
    id="postContent"
    placeholder="잃어버린 장소, 시간, 물건의 특징 등을 적어주세요."
    rows="6"
  ></textarea>

  <button onclick="submitPost()">제보하기</button>

  <p id="postMessage"></p>
</div>
  <div class="hero">
    <h2>잃어버린 물건,<br>여기서 찾아보세요.</h2>
    <p>진영고 학생들을 위한 분실물·습득물 알림 사이트입니다.</p>
  </div>

  <div class="cards">

    <div class="card">
      <h3>🔎 분실물 찾기</h3>
      <p>잃어버린 물건을 확인할 수 있습니다.</p>
      <button onclick="alert('분실물 목록은 다음 단계에서 연결됩니다.')">
        확인하기
      </button>
    </div>

    <div class="card">
      <h3>📦 습득물 확인</h3>
      <p>학교에서 발견된 물건을 확인할 수 있습니다.</p>
      <button onclick="alert('습득물 목록은 다음 단계에서 연결됩니다.')">
        확인하기
      </button>
    </div>

    <div class="card">
      <h3>📝 분실물 제보</h3>
      <p>잃어버린 물건이나 발견한 물건을 제보합니다.</p>
      <button onclick="checkLogin()">
        제보하기
      </button>
    </div>

  </div>

  <div class="login-box">

    <h3>로그인</h3>

    <div id="loginForm">
      <input
        type="email"
        id="email"
        placeholder="이메일"
      >

      <input
        type="password"
        id="password"
        placeholder="비밀번호"
      >

      <button onclick="login()">로그인</button>
    </div>

    <div id="userInfo"></div>

  </div>

</div>

<script>

  // Supabase 연결
  const SUPABASE_URL = "https://wxrkhzwnfyvspfpwaowl.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_jTiQ2IUkhmyq50YBzWqu1w_79l5IWno";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  // 로그인
  async function login() {

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;

    if (!email || !password) {
      alert("이메일과 비밀번호를 입력해주세요.");
      return;
    }

    const { data, error } =
      await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });

    if (error) {
      alert("로그인에 실패했습니다.\n" + error.message);
      return;
    }

    alert("로그인되었습니다!");

    updateLoginState();

  }


  // 로그아웃
  async function logout() {

    const { error } =
      await supabaseClient.auth.signOut();

    if (error) {
      alert("로그아웃에 실패했습니다.");
      return;
    }

    alert("로그아웃되었습니다.");

    updateLoginState();

  }


  // 로그인 상태 확인
  async function updateLoginState() {

    const {
      data: { user }
    } = await supabaseClient.auth.getUser();

    const loginForm =
      document.getElementById("loginForm");

    const userInfo =
      document.getElementById("userInfo");

    const logoutBtn =
      document.getElementById("logoutBtn");


    if (user) {

      loginForm.classList.add("hidden");

      logoutBtn.classList.remove("hidden");

      userInfo.style.display = "block";

      userInfo.innerHTML =
        "현재 로그인한 계정<br><strong>" +
        user.email +
        "</strong>";

      checkAdmin(user.id);

    } else {

      loginForm.classList.remove("hidden");

      logoutBtn.classList.add("hidden");

      userInfo.style.display = "none";

    }

  }


  // 관리자 확인
  async function checkAdmin(userId) {

    const { data, error } =
      await supabaseClient
        .from("user_roles")
        .select("role")
        .eq("user_id", userId)
        .maybeSingle();

    if (!error && data && data.role === "admin") {

      const userInfo =
        document.getElementById("userInfo");

      userInfo.innerHTML +=
        "<br><strong>관리자 계정</strong>";

    }

  }


  // 제보 버튼
  async function checkLogin() {

    const {
      data: { user }
    } = await supabaseClient.auth.getUser();

    if (!user) {

      alert("분실물 제보를 하려면 먼저 로그인해주세요.");

      return;

    }

    alert(
      "로그인 확인 완료!\n분실물 제보 기능은 다음 단계에서 연결됩니다."
    );

  }


  // 로그아웃 버튼
  document
    .getElementById("logoutBtn")
    .addEventListener("click", logout);


  // 페이지 처음 열었을 때 로그인 상태 확인
  updateLoginState();


  // 로그인 상태 변화 감지
  supabaseClient.auth.onAuthStateChange(
    () => {
      updateLoginState();
    }
  );
async function submitPost() {

  const {
    data: { user }
  } = await supabaseClient.auth.getUser();

  if (!user) {
    alert("제보하려면 먼저 로그인해주세요.");
    return;
  }

  const type =
    document.getElementById("postType").value;

  const title =
    document.getElementById("postTitle").value.trim();

  const content =
    document.getElementById("postContent").value.trim();

  if (!title || !content) {
    alert("제목과 내용을 모두 입력해주세요.");
    return;
  }

  const { error } =
    await supabaseClient
      .from("posts")
      .insert({
        type: type,
        title: title,
        content: content,
        author_id: user.id,
        status: "pending"
      });

  if (error) {
    console.error(error);
    alert("제보에 실패했습니다.\n" + error.message);
    return;
  }

  document.getElementById("postTitle").value = "";
  document.getElementById("postContent").value = "";

  alert(
    "제보가 접수되었습니다!\n관리자 확인 후 게시됩니다."
  );
}
</script>

</body>
</html>
