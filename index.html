<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>진영고 분실물 알림</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: #f4f8fc;
  color: #1f2937;
}

header {
  background: linear-gradient(135deg, #2563eb, #3b82f6);
  color: white;
  padding: 28px 20px;
  text-align: center;
}

header h1 {
  margin: 0 0 8px;
  font-size: 28px;
}

header p {
  margin: 0;
  opacity: 0.9;
}

.container {
  max-width: 1000px;
  margin: 24px auto;
  padding: 0 16px;
}

.box {
  background: white;
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 20px;
  box-shadow: 0 4px 16px rgba(37, 99, 235, 0.08);
  border: 1px solid #e5eef9;
}

.box h2 {
  margin-top: 0;
  color: #1d4ed8;
}

/* 공개된 분실물/습득물 목록 */
#postList {
  max-height: 520px;
  overflow-y: auto;
  padding: 4px;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 14px;
}

/* 각각의 분실물 카드 */
.post-card {
  background: #ffffff;
  border: 1px solid #dbeafe;
  border-radius: 12px;
  padding: 12px;
  min-width: 0;
  box-shadow: 0 2px 8px rgba(37, 99, 235, 0.07);
  transition: transform 0.15s, box-shadow 0.15s;
}

.post-card:hover {
  transform: translateY(-2px);
  box-shadow: 0 5px 14px rgba(37, 99, 235, 0.13);
}

.post-card img {
  width: 100%;
  height: 130px;
  object-fit: cover;
  border-radius: 9px;
  margin-bottom: 8px;
}

.post-card h3 {
  margin: 4px 0 6px;
  font-size: 16px;
  color: #1e3a8a;
}

.post-card p {
  margin: 4px 0;
  font-size: 13px;
  line-height: 1.4;
  color: #64748b;
}

/* 스크롤바 */
#postList::-webkit-scrollbar {
  width: 7px;
}

#postList::-webkit-scrollbar-thumb {
  background: #93c5fd;
  border-radius: 10px;
}

#postList::-webkit-scrollbar-track {
  background: #eff6ff;
  border-radius: 10px;
}

/* 입력창 */
input,
textarea,
select {
  width: 100%;
  padding: 11px 12px;
  margin: 6px 0 12px;
  border: 1px solid #cbd5e1;
  border-radius: 9px;
  font-size: 14px;
}

input:focus,
textarea:focus,
select:focus {
  outline: none;
  border-color: #3b82f6;
  box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.12);
}

/* 버튼 */
button {
  background: #2563eb;
  color: white;
  border: none;
  padding: 10px 16px;
  border-radius: 9px;
  cursor: pointer;
  font-weight: 600;
}

button:hover {
  background: #1d4ed8;
}

.hidden {
  display: none !important;
}

/* 관리자 게시글 */
.admin-post {
  border: 1px solid #bfdbfe;
  background: #f8fbff;
  border-radius: 12px;
  padding: 14px;
  margin-bottom: 12px;
}

/* 모바일 */
@media (max-width: 700px) {
  #postList {
    grid-template-columns: repeat(2, 1fr);
    max-height: 500px;
  }

  .post-card img {
    height: 110px;
  }

  .container {
    padding: 0 12px;
  }
}

@media (max-width: 430px) {
  #postList {
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
  }

  .post-card {
    padding: 9px;
  }

  .post-card img {
    height: 95px;
  }

  .post-card h3 {
    font-size: 14px;
  }

  .post-card p {
    font-size: 12px;
  }
}
    /* 공개 분실물·습득물 목록 */
#postList {
  max-height: 520px !important;
  overflow-y: auto !important;

  display: grid !important;
  grid-template-columns: repeat(3, minmax(0, 1fr)) !important;
  gap: 14px !important;

  padding: 8px !important;
}

/* 분실물 하나하나를 카드로 */
#postList > div {
  width: auto !important;
  min-width: 0 !important;
  height: fit-content !important;

  background: #ffffff !important;
  border: 1px solid #dbeafe !important;
  border-radius: 12px !important;

  padding: 12px !important;
  margin: 0 !important;

  box-shadow: 0 2px 8px rgba(37, 99, 235, 0.08) !important;
}

/* 카드 안 사진 */
#postList > div img {
  width: 100% !important;
  height: 120px !important;
  object-fit: cover !important;
  border-radius: 8px !important;
}

/* 제목 */
#postList > div h3 {
  font-size: 16px !important;
  margin: 7px 0 5px !important;
  color: #1d4ed8 !important;
}

/* 내용 */
#postList > div p {
  font-size: 13px !important;
  line-height: 1.4 !important;
  margin: 4px 0 !important;
}

/* 스크롤바 */
#postList::-webkit-scrollbar {
  width: 7px;
}

#postList::-webkit-scrollbar-thumb {
  background: #93c5fd;
  border-radius: 10px;
}

/* 아이패드·휴대폰 */
@media (max-width: 700px) {
  #postList {
    grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
  }

  #postList > div img {
    height: 100px !important;
  }
}
</style>
  
</head>

<body>

<header>
  <h1>진영고 분실물 알림</h1>

  <button id="logoutBtn" class="hidden">
    로그아웃
  </button>
</header>


<div class="container">

  <!-- 메인 -->
  <section class="hero">
    <h2>잃어버린 물건,<br>여기서 찾아보세요.</h2>

    <p>
      진영고 학생들을 위한 분실물·습득물 알림 사이트입니다.
    </p>
  </section>


  <!-- 검색 -->
  <div class="box">

    <h2>🔎 분실물·습득물 찾기</h2>

    <div class="search-row">

      <input
        id="searchInput"
        type="text"
        placeholder="예: 검은색 지갑"
      >

      <button onclick="loadPosts()">
        검색
      </button>

    </div>

  </div>


  <!-- 공개 게시글 -->
  <div class="box">

    <h2>📋 공개된 분실물·습득물</h2>

    <div id="postList">
      <div class="empty">
        게시글을 불러오는 중...
      </div>
    </div>

  </div>


  <!-- 제보 -->
  <div class="box">

    <h2>📝 분실물·습득물 제보</h2>

    <p class="notice">
      로그인하지 않아도 제보할 수 있습니다.
      모든 제보는 관리자 확인 후 공개됩니다.
    </p>

    <label>구분</label>

    <select id="postType">
      <option value="lost">분실물</option>
      <option value="found">습득물</option>
    </select>


    <label>제목</label>

    <input
      id="postTitle"
      type="text"
      placeholder="예: 검은색 지갑을 잃어버렸어요"
    >


    <label>내용</label>

    <textarea
      id="postContent"
      rows="6"
      placeholder="잃어버린 장소, 시간, 물건의 특징 등을 적어주세요."
    ></textarea>


    <label>사진</label>

    <input
      id="postImage"
      type="file"
      accept="image/*"
    >

    <p class="notice">
      사진은 1장만 첨부할 수 있습니다.
    </p>


    <button onclick="submitPost()">
      제보하기
    </button>

  </div>


  <!-- 로그인 -->
  <div class="box">

    <h2>🔐 관리자 로그인</h2>

    <div id="loginForm">

      <input
        id="email"
        type="email"
        placeholder="이메일"
      >

      <input
        id="password"
        type="password"
        placeholder="비밀번호"
      >

      <button onclick="login()">
        로그인
      </button>

    </div>

    <div
      id="userInfo"
      class="user-info hidden"
    ></div>

  </div>


  <!-- 관리자 -->
  <div
    id="adminPanel"
    class="box hidden"
  >

    <h2>🛡️ 관리자 관리 페이지</h2>

    <p class="notice">
      관리자만 볼 수 있는 페이지입니다.
    </p>

    <button onclick="loadAdminPosts()">
      승인 대기 제보 새로고침
    </button>

    <div id="adminList">
      <div class="empty">
        불러오는 중...
      </div>
    </div>

  </div>

</div>


<script>

  /* =========================
     Supabase 연결
  ========================= */

  const SUPABASE_URL =
    "https://wxrkhzwnfyvspfpwaowl.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_jTiQ2IUkhmyq50YBzWqu1w_79l5IWno";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /* =========================
     로그인
  ========================= */

  async function login() {

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;


    if (!email || !password) {
      alert("이메일과 비밀번호를 입력해주세요.");
      return;
    }


    const { error } =
      await supabaseClient.auth.signInWithPassword({
        email,
        password
      });


    if (error) {
      alert("로그인에 실패했습니다.\n" + error.message);
      return;
    }


    alert("로그인되었습니다.");

    await updateLoginState();
  }


  /* =========================
     로그아웃
  ========================= */

  async function logout() {

    await supabaseClient.auth.signOut();

    document
      .getElementById("adminPanel")
      .classList.add("hidden");

    await updateLoginState();

    alert("로그아웃되었습니다.");
  }


  /* =========================
     로그인 상태
  ========================= */

  async function updateLoginState() {

    const {
      data: { user }
    } = await supabaseClient.auth.getUser();


    const loginForm =
      document.getElementById("loginForm");

    const userInfo =
      document.getElementById("userInfo");

    const logoutBtn =
      document.getElementById("logoutBtn");

    const adminPanel =
      document.getElementById("adminPanel");


    if (!user) {

      loginForm.classList.remove("hidden");

      userInfo.classList.add("hidden");

      logoutBtn.classList.add("hidden");

      adminPanel.classList.add("hidden");

      return;
    }


    loginForm.classList.add("hidden");

    logoutBtn.classList.remove("hidden");

    userInfo.classList.remove("hidden");

    userInfo.innerHTML =
      "로그인 계정: <strong>" +
      user.email +
      "</strong>";


    await checkAdmin(user.id);
  }


  /* =========================
     관리자 확인
  ========================= */

  async function checkAdmin(userId) {

  const { data, error } =
    await supabaseClient.rpc("check_is_admin");

  const adminPanel =
    document.getElementById("adminPanel");

  const userInfo =
    document.getElementById("userInfo");

  if (!error && data === true) {

    userInfo.innerHTML +=
      "<br><strong>🛡️ 관리자</strong>";

    adminPanel.classList.remove("hidden");

    await loadAdminPosts();

  } else {

    adminPanel.classList.add("hidden");

    console.log("관리자 확인 결과:", error, data);
  }
}


  /* =========================
     사진 업로드
  ========================= */

  async function uploadImage(file) {

    if (!file) {
      return null;
    }


    if (!file.type.startsWith("image/")) {
      throw new Error("이미지 파일만 업로드할 수 있습니다.");
    }


    if (file.size > 5 * 1024 * 1024) {
      throw new Error("사진은 5MB 이하만 업로드할 수 있습니다.");
    }


    const extension =
      file.name.split(".").pop().toLowerCase();


    const fileName =
      Date.now() +
      "-" +
      Math.random().toString(36).substring(2) +
      "." +
      extension;


    const { error } =
      await supabaseClient
        .storage
        .from("lost-found-images")
        .upload(
          fileName,
          file,
          {
            contentType: file.type,
            upsert: false
          }
        );


    if (error) {
      throw error;
    }


    const { data } =
      supabaseClient
        .storage
        .from("lost-found-images")
        .getPublicUrl(fileName);


    return data.publicUrl;
  }


  /* =========================
     제보하기
  ========================= */

  async function submitPost() {

    const type =
      document.getElementById("postType").value;

    const title =
      document.getElementById("postTitle").value.trim();

    const content =
      document.getElementById("postContent").value.trim();

    const file =
      document.getElementById("postImage").files[0];


    if (!title || !content) {

      alert("제목과 내용을 모두 입력해주세요.");

      return;
    }


    try {

      const {
        data: { user }
      } = await supabaseClient.auth.getUser();


      let imageUrl = null;


      if (file) {

        imageUrl =
          await uploadImage(file);
      }


      const { error } =
        await supabaseClient
          .from("posts")
          .insert({
            type,
            title,
            content,
            author_id: user ? user.id : null,
            image_url: imageUrl,
            status: "pending"
          });


      if (error) {
        throw error;
      }


      document.getElementById("postTitle").value = "";
      document.getElementById("postContent").value = "";
      document.getElementById("postImage").value = "";


      alert(
        "제보가 접수되었습니다.\n\n" +
        "관리자 확인 후 공개됩니다."
      );

    } catch (error) {

      console.error(error);

      alert(
        "제보에 실패했습니다.\n\n" +
        error.message
      );
    }
  }


  /* =========================
     공개 게시글 불러오기
  ========================= */

  async function loadPosts() {

    const postList =
      document.getElementById("postList");

    const keyword =
      document
        .getElementById("searchInput")
        .value
        .trim();


    let query =
      supabaseClient
        .from("posts")
        .select("*")
        .eq("status", "approved")
        .order("created_at", {
          ascending: false
        });


    if (keyword) {

      query =
        query.or(
          "title.ilike.%" +
          keyword +
          "%,content.ilike.%" +
          keyword +
          "%"
        );
    }


    const { data, error } =
      await query;


    if (error) {

      postList.innerHTML =
        "<p>게시글을 불러오지 못했습니다.</p>";

      console.error(error);

      return;
    }


    if (!data || data.length === 0) {

      postList.innerHTML =
        "<div class='empty'>등록된 게시글이 없습니다.</div>";

      return;
    }


    postList.innerHTML =
      data.map(post => renderPost(post)).join("");
  }


  /* =========================
     게시글 화면
  ========================= */

  function renderPost(post) {

    const typeText =
      post.type === "lost"
        ? "분실물"
        : "습득물";


    const image =
      post.image_url
        ? `
          <img
            src="${escapeHtml(post.image_url)}"
            alt="첨부 사진"
          >
        `
        : "";


    return `
      <div class="post">

        <span class="badge ${post.type}">
          ${typeText}
        </span>

        <h3>
          ${escapeHtml(post.title)}
        </h3>

        <p>
          ${escapeHtml(post.content)}
        </p>

        ${image}

      </div>
    `;
  }


  /* =========================
     관리자 글 불러오기
  ========================= */

  async function loadAdminPosts() {

    const adminList =
      document.getElementById("adminList");


    const { data, error } =
      await supabaseClient
        .from("posts")
        .select("*")
        .eq("status", "pending")
        .order("created_at", {
          ascending: true
        });


    if (error) {

      adminList.innerHTML =
        "<p>관리자 글을 불러오지 못했습니다.</p>";

      console.error(error);

      return;
    }


    if (!data || data.length === 0) {

      adminList.innerHTML =
        "<div class='empty'>승인 대기 중인 제보가 없습니다.</div>";

      return;
    }


    adminList.innerHTML =
      data
        .map(post => renderAdminPost(post))
        .join("");
  }


  /* =========================
     관리자 게시글 화면
  ========================= */

  function renderAdminPost(post) {

    const typeText =
      post.type === "lost"
        ? "분실물"
        : "습득물";


    const image =
      post.image_url
        ? `
          <img
            src="${escapeHtml(post.image_url)}"
            alt="첨부 사진"
          >
        `
        : "";


    return `
      <div class="post">

        <span class="badge pending">
          승인 대기
        </span>

        <span class="badge ${post.type}">
          ${typeText}
        </span>

        <h3>
          ${escapeHtml(post.title)}
        </h3>

        <p>
          ${escapeHtml(post.content)}
        </p>

        ${image}

        <div class="admin-actions">

          <button
            class="approve"
            onclick="changeStatus(${post.id}, 'approved')"
          >
            ✅ 승인
          </button>

          <button
            class="reject"
            onclick="changeStatus(${post.id}, 'rejected')"
          >
            ❌ 거절
          </button>

          <button
            class="secondary"
            onclick="deletePost(${post.id})"
          >
            🗑️ 삭제
          </button>

        </div>

      </div>
    `;
  }


  /* =========================
     승인 / 거절
  ========================= */

  async function changeStatus(id, status) {

    const message =
      status === "approved"
        ? "이 제보를 승인할까요?"
        : "이 제보를 거절할까요?";


    if (!confirm(message)) {
      return;
    }


    const { error } =
      await supabaseClient
        .from("posts")
        .update({
          status
        })
        .eq("id", id);


    if (error) {

      alert(
        "처리하지 못했습니다.\n" +
        error.message
      );

      return;
    }


    alert(
      status === "approved"
        ? "승인되었습니다."
        : "거절되었습니다."
    );


    await loadAdminPosts();
    await loadPosts();
  }


  /* =========================
     삭제
  ========================= */

  async function deletePost(id) {

    if (!confirm("이 제보를 삭제할까요?")) {
      return;
    }


    const { error } =
      await supabaseClient
        .from("posts")
        .delete()
        .eq("id", id);


    if (error) {

      alert(
        "삭제하지 못했습니다.\n" +
        error.message
      );

      return;
    }


    alert("삭제되었습니다.");

    await loadAdminPosts();
    await loadPosts();
  }


  /* =========================
     HTML 안전 처리
  ========================= */

  function escapeHtml(value) {

    if (!value) {
      return "";
    }

    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }


  /* =========================
     시작
  ========================= */

  document
    .getElementById("logoutBtn")
    .addEventListener(
      "click",
      logout
    );


  supabaseClient.auth.onAuthStateChange(
    () => {
      updateLoginState();
    }
  );


  updateLoginState();
  loadPosts();

</script>

</body>
</html>
